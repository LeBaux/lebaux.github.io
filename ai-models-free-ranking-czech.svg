<svg width="1000" height="1290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Hlavička -->
  <text x="500" y="55" text-anchor="middle" fill="#f8fafc" font-size="36" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">🏆 Žebříček AI agentů zdarma</text>
  <text x="500" y="88" text-anchor="middle" fill="#94a3b8" font-size="17"
        font-family="Segoe UI, Arial, sans-serif">Kteří AI asistenti jsou nejlepší zdarma? Osobní hodnocení.</text>
  <line x1="200" y1="108" x2="800" y2="108" stroke="#334155" stroke-width="1"/>

  <!-- 1. místo – Gemini -->
  <rect x="80" y="140" width="840" height="250" rx="18" fill="#1e293b" stroke="#FFD700" stroke-width="3"/>
  <rect x="80" y="140" width="10" height="250" rx="5" fill="#FFD700"/>
  <text x="145" y="270" text-anchor="middle" font-size="70"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🥇</text>
  <text x="205" y="190" fill="#FFD700" font-size="26" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">Google Notebook (Gemini)</text>
  <text x="205" y="225" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Nejlepší organizace souborů a hlavně integrace do všech produktů Google.</text>
  <text x="205" y="250" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Sám o sobě není Gemini lepší než ChatGPT nebo Claude, ale ty integrace</text>
  <text x="205" y="275" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">a hlavně Google Notebook dělají Notebook doslova nepostradatelný, pokud</text>
  <text x="205" y="300" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">pracujete s tisíci zdroji. Pokud ne, ohlédněte se jinde. Určitě bych</text>
  <text x="205" y="325" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">tento model nedoporučil na tvorbu obrázků, plakátů nebo videí – na to</text>
  <text x="205" y="350" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">jsou jiné modely. Pro vědce je ale nepřekonatelný... ani ne model, ale</text>
  <text x="205" y="375" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">hlavně Notebook.</text>

  <!-- 2. místo – ChatGPT & Claude -->
  <rect x="80" y="410" width="840" height="230" rx="18" fill="#1e293b" stroke="#C0C0C0" stroke-width="3"/>
  <rect x="80" y="410" width="10" height="230" rx="5" fill="#C0C0C0"/>
  <text x="145" y="525" text-anchor="middle" font-size="70"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🥈</text>
  <text x="205" y="460" fill="#C0C0C0" font-size="26" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">ChatGPT &amp; Claude</text>
  <text x="205" y="495" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Oba super, podobně kvalitní výstupy. Jsou to prostě dva lídři na trhu,</text>
  <text x="205" y="520" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">stejně jako Android a iPhone. Když používáte kterýkoliv z těchto dvou,</text>
  <text x="205" y="545" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">nemůžete udělat chybu. V placených verzích je kvalita samozřejmě o 10</text>
  <text x="205" y="570" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">levelů jinde, ale teď řešíme free verzi. Voice chat je lepší u Claude,</text>
  <text x="205" y="595" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">u ChatGPT je zase lepší aktuálnost informací. Nevidím jasného vítěze,</text>
  <text x="205" y="620" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">oba skvělé modely.</text>

  <!-- 3. místo – Mistral -->
  <rect x="80" y="660" width="840" height="150" rx="18" fill="#1e293b" stroke="#CD7F32" stroke-width="3"/>
  <rect x="80" y="660" width="10" height="150" rx="5" fill="#CD7F32"/>
  <text x="145" y="745" text-anchor="middle" font-size="70"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🥉</text>
  <text x="205" y="710" fill="#CD7F32" font-size="26" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">Mistral AI</text>
  <text x="205" y="745" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Skvělý na programování a za rozumnou cenu. Horší „vyhledávač“ než</text>
  <text x="205" y="770" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Gemini, ChatGPT a Claude.</text>

  <!-- 4. místo – DeepSeek (medaile emoji) -->
  <rect x="80" y="830" width="840" height="120" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="80" y="830" width="10" height="120" rx="5" fill="#38bdf8"/>
  <text x="145" y="905" text-anchor="middle" font-size="70"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🏅</text>
  <text x="205" y="880" fill="#38bdf8" font-size="26" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">DeepSeek</text>
  <text x="205" y="915" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Rychle rostoucí open-source model, silný hlavně v logice a kódu. (popis doplň)</text>

  <!-- 5. místo – duck.ai -->
  <rect x="80" y="970" width="840" height="200" rx="18" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <rect x="80" y="970" width="10" height="200" rx="5" fill="#4ade80"/>
  <text x="145" y="1085" text-anchor="middle" font-size="60"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🦆</text>
  <text x="205" y="1020" fill="#4ade80" font-size="26" font-weight="bold"
        font-family="Segoe UI, Arial, sans-serif">duck.ai</text>
  <text x="205" y="1055" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">Kompletně zdarma a má vícero modelů na zkoušku. Samozřejmě že je</text>
  <text x="205" y="1080" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">limitováno, kolik jde vygenerovat třeba obrázků, ale nevadí. Hlavní</text>
  <text x="205" y="1105" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">hodnota duck.ai je soukromí – chaty by měly být anonymizované a můžete</text>
  <text x="205" y="1130" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">tady řešit „nepříjemné“ otázky jako deprese nebo finanční problémy nebo</text>
  <text x="205" y="1155" fill="#e2e8f0" font-size="16"
        font-family="Segoe UI, Arial, sans-serif">že vás žena podvádí, co já vím.</text>

  <!-- Patička -->
  <line x1="200" y1="1200" x2="800" y2="1200" stroke="#334155" stroke-width="1"/>
  <text x="500" y="1235" text-anchor="middle" fill="#64748b" font-size="14"
        font-family="Segoe UI, Arial, sans-serif">🥇 zlato · 🥈 stříbro (sdíleno) · 🥉 bronz · 🏅 čestná medaile · 🦆 plně zdarma</text>
  <text x="500" y="1260" text-anchor="middle" fill="#64748b" font-size="13"
        font-family="Segoe UI, Arial, sans-serif">Hodnocení free verzí – placené verze jsou kvalitativně jinde.</text>
</svg>