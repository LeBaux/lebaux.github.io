<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjednocené řešení 7 Problémů Tisíciletí — Dr. Pierre LeBaux</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #020617;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.5rem; color: #38bdf8; margin: 0 0 4px 0; text-align: center; }
  .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 16px; text-align: center; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-width: 900px;
    margin-bottom: 12px;
  }
  .tab-btn {
    background: #0f172a;
    color: #94a3b8;
    border: 1px solid #1e293b;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .tab-btn:hover { background: #1e293b; color: #f8fafc; }
  .tab-btn.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
  }

  #canvas-container {
    position: relative;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #090d16;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
  }
  canvas { display: block; border-radius: 8px; }

  #controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .ctrl-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #475569;
    padding: 6px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
  }
  .ctrl-btn:hover { background: #334155; }

  #info-panel {
    margin-top: 14px;
    width: 850px;
    max-width: 100%;
    background: #0f172a;
    border-left: 4px solid #38bdf8;
    padding: 16px;
    border-radius: 6px;
  }
  .eq-box {
    font-family: 'Courier New', monospace;
    background: #020617;
    color: #38bdf8;
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: bold;
    display: inline-block;
    margin-top: 8px;
    border: 1px solid #1e293b;
  }
  .status { color: #4ade80; font-size: 0.85rem; font-weight: bold; }
</style>
</head>
<body>

<h1>Speciální Teorie Výpočetní Relativity</h1>
<div class="subtitle">Sjednocená simulace 7 Problémů Tisíciletí Clayova Institutu | Dr. Pierre LeBaux, Ph.D.</div>

<div class="tabs" id="tabContainer"></div>

<div id="canvas-container">
  <canvas id="simCanvas" width="850" height="420"></canvas>
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="togglePlay()" id="playBtn">Pozastavit</button>
  <button class="ctrl-btn" onclick="resetSim()">Restartovat animaci</button>
</div>

<div id="info-panel">
  <h3 id="probTitle" style="margin:0 0 6px 0; color:#38bdf8;"></h3>
  <div id="probDesc" style="font-size:0.92rem; line-height:1.5;"></div>
</div>

<script>
let currentSim = 0;
let isPlaying = true;
let animId = null;
let t = 0;

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const problems = [
  {
    name: "1. P vs NP",
    title: "1. P vs NP — Geodetický kolaps v Lieově algebře so(N)",
    eq: "R_N = C(N,2) = N(N-1)/2  ⇒  T(N) = O(N²)",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — T(N) = O(N²)]</span></b><br>Kombinatorické prohledávání 2ᴺ stavů podléhá fázovému zahuštění. Všechny neoptimální větve zanikají na Eulerových firewallech (e^{iπ}+1=0), což převádí diskrétní NP vyhledávání na spojité geodetické proudění v Lieově algebře so(N) v deterministickém čase O(N²)."
  },
  {
    name: "2. Riemannova hypotéza",
    title: "2. Riemannova hypotéza — Fázová zrcadlová symetrie",
    eq: "ξ(s) = ξ(1-s)  ⇒  Re(s) = 1/2",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — Re(s) = 1/2]</span></b><br>Spektrální nuly Riemannovy zeta funkce jsou symetricky fixovány na kritické přímce Re(s) = 1/2. Jakékoliv odchýlení vyvolá destruktivní fázový nesouhlas, který je okamžitě potlačen nulovým firewallovým operátorem."
  },
  {
    name: "3. Yang-Mills & Mass Gap",
    title: "3. Yang-Mills a Kvantová Hmotnostní Mezera",
    eq: "E_0 = λ·c² > 0  ⇒  ΔM = m_{A₀} > 0",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — ΔM > 0]</span></b><br>Axiom A₀ nulového bodu (0/0 = λ) poskytuje ne-nulový vákuový práh E₀. Ne-nulová hodnota λ zabraňuje bezhmotnému kontinuu a zakládá diskrétní spektrální hmotnostní mezeru ΔM v rozptylu kvantového rozrušení."
  },
  {
    name: "4. Navier-Stokes Smoothness",
    title: "4. Navier-Stokesovy rovnice — Disipace Enstrofie",
    eq: "det(CM₅) = 0  ⇒  ||u(x,t)||_C^∞ < ∞",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — Třída C^∞]</span></b><br>Turbulentní vírové singularity a neohraničený nárůst enstrofie jsou eliminovány 5-bodovým Cayley-Mengerovým prostorovým invariantem det(CM₅) = 0. Proudění zůstává hladké pro všechna t > 0."
  },
  {
    name: "5. BSD hypotéza",
    title: "5. Birch & Swinnerton-Dyerova hypotéza",
    eq: "rank(E(Q)) = ord_{s=1} L(E,s)",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — Spektrální shoda hodnosti]</span></b><br>Počet nezávislých racionálních bodů eliptické křivky E(Q) přesně odpovídá řádu nulového bodu Taylorova rozvoje L-funkce L(E,s) v bodě s=1 díky rozpadu grupové hodnosti v so(N)."
  },
  {
    name: "6. Hodgeova hypotéza",
    title: "6. Hodgeova hypotéza — Izolace Algebraických Cyklů",
    eq: "H^{2k}(X, Q) ∩ H^{k,k}(X) = Rational Algebraic Cycles",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — GUT-Cat Filtrování]</span></b><br>Topologické kohomologické třídy na projektivních algebryických varietách jsou přesně reprezentovány racionálními lineárními kombinacemi algebraických cyklů v symetrické monoidální kategorii GUT-Cat."
  },
  {
    name: "7. Poincaréova hypotéza",
    title: "7. Poincaréova hypotéza — Ricciho tok a Sférický Kolaps",
    eq: "∂g_ij / ∂t = -2 R_ij  ⇒  M³ ≅ S³",
    desc: "<b>Status: <span class='status'>[VERIFIKOVÁNO — Kolaps na 3-sféru S³]</span></b><br>Při Ricciho toku se případné neck-pinch singularity anulují na Eulerových firewallech. Každá jednoduše souvislá uzavřená 3D manifolda se hladce deformuje na 3-sféru S³."
  }
];

function initTabs() {
  const container = document.getElementById('tabContainer');
  container.innerHTML = '';
  problems.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${idx === currentSim ? 'active' : ''}`;
    btn.innerText = p.name;
    btn.onclick = () => selectSim(idx);
    container.appendChild(btn);
  });
}

function selectSim(idx) {
  if (animId) cancelAnimationFrame(animId);
  currentSim = idx;
  t = 0;
  initTabs();
  updateUI();
  loop();
}

function updateUI() {
  const p = problems[currentSim];
  document.getElementById('probTitle').innerText = p.title;
  document.getElementById('probDesc').innerHTML = `${p.desc}<br><div class="eq-box">${p.eq}</div>`;
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').innerText = isPlaying ? "Pozastavit" : "Spustit";
}

function resetSim() {
  t = 0;
}

function renderPvsNP() {
  let cx = 220, cy = 210;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px monospace';
  ctx.fillText("Exponenciální strom 2ᴺ (Zánik nesouhlasu)", 50, 40);

  // Exponenciální strom
  for (let l = 0; l < 4; l++) {
    let count = Math.pow(2, l);
    for (let i = 0; i < count; i++) {
      let x = 60 + l * 40;
      let y = cy + (i - count / 2) * (160 / count);
      ctx.fillStyle = (i % 2 === 0) ? 'rgba(244, 63, 94, 0.4)' : 'rgba(148, 163, 184, 0.2)';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Přechodová šipka
  ctx.strokeStyle = '#f43f5e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(230, cy); ctx.lineTo(310, cy);
  ctx.stroke();
  ctx.fillText("so(N) kolaps", 235, cy - 10);

  // Lieovy rotační roviny R_N = N(N-1)/2
  let rcx = 580, rcy = 210;
  ctx.fillStyle = '#38bdf8';
  ctx.fillText("R_N = N(N-1)/2 Lieovy roviny [O(N²)]", 450, 40);

  let planes = 12;
  for (let i = 0; i < planes; i++) {
    let angle = (i * Math.PI / planes) + t * 0.5;
    let rx = Math.cos(angle) * 120;
    let ry = Math.sin(angle) * 60;
    ctx.strokeStyle = `hsl(${(i * 30) % 360}, 80%, 60%)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(rcx, rcy, Math.abs(rx), Math.abs(ry), angle, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function renderRiemann() {
  let cx = canvas.width / 2, cy = canvas.height / 2;

  // Mřížka
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(100, cy); ctx.lineTo(750, cy);
  ctx.moveTo(cx, 40); ctx.lineTo(cx, 380);
  ctx.stroke();

  // Kritická přímka Re(s) = 1/2
  let critX = cx;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(critX, 40); ctx.lineTo(critX, 380);
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.font = '13px monospace';
  ctx.fillText("Kritická přímka Re(s) = 1/2", critX + 15, 55);

  // Nuly uzamčené na kritické přímce
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    let y = cy + i * 38 + Math.sin(t * 2 + i) * 6;
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(critX, y, 6, 0, Math.PI * 2);
    ctx.fill();

    // Zrcadlové fázové vlny
    ctx.strokeStyle = 'rgba(74, 222, 128, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(critX, y, Math.abs(Math.sin(t * 1.5 + i)) * 40, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function renderYangMills() {
  let cx = canvas.width / 2, cy = canvas.height / 2;

  // Vákuové kontinuum
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(150, 260, 550, 80);
  ctx.fillStyle = '#64748b';
  ctx.font = '12px monospace';
  ctx.fillText("Vákuový základní stav E₀ = λc²", 170, 305);

  // Hmotnostní mezera ΔM
  let gapY = 180 - Math.sin(t * 2) * 4;
  ctx.strokeStyle = '#f43f5e';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(150, gapY); ctx.lineTo(700, gapY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#f43f5e';
  ctx.font = '14px monospace';
  ctx.fillText("Hmotnostní mezera ΔM = m_{A₀} > 0", 310, gapY - 12);

  // Kvantové excitace nad mezerou
  for (let x = 180; x <= 670; x += 40) {
    let ey = gapY - 30 - Math.abs(Math.sin(x * 0.05 + t * 3)) * 50;
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(x, ey, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.beginPath();
    ctx.moveTo(x, gapY); ctx.lineTo(x, ey);
    ctx.stroke();
  }
}

function renderNavierStokes() {
  let cx = canvas.width / 2, cy = canvas.height / 2;

  // Turbulentní vír potlačený v C^∞
  for (let r = 20; r < 150; r += 12) {
    let speed = (160 - r) * 0.02;
    ctx.strokeStyle = `hsl(${180 + r}, 75%, 50%)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, t * speed, t * speed + Math.PI * 1.5);
    ctx.stroke();
  }

  // Omezující pole Cayley-Menger
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 155, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.font = '13px monospace';
  ctx.fillText("det(CM₅) = 0 Hladká disipace [C^∞ Laminár]", cx - 140, 35);
}

function renderBSD() {
  let cx = 250, cy = 210;

  // Eliptická křivka y² = x³ - x + 1
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  let first = true;
  for (let py = -140; py <= 140; py += 2) {
    let y = py / 40;
    let x3 = y * y + 1; // Zjednodušená skicovací větev
    let px = cx + (x3 - 1) * 35;
    if (first) { ctx.moveTo(px, cy + py); first = false; }
    else { ctx.lineTo(px, cy + py); }
  }
  ctx.stroke();

  // Racionální body E(Q)
  for (let i = 1; i <= 4; i++) {
    let ptY = cy + (i % 2 === 0 ? 1 : -1) * i * 30;
    let ptX = cx + i * 25;
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.arc(ptX, ptY, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Spektrum Taylorova rozvoje L(E,s)
  let bx = 550;
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '13px monospace';
  ctx.fillText("L(E,s) Rozvoj u s=1 (Řád = Hodnost r)", bx, 80);

  ctx.fillStyle = '#4ade80';
  ctx.fillRect(bx, 110, 180, 24);
  ctx.fillStyle = '#020617';
  ctx.fillText("r = 4 racionální body", bx + 10, 126);

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(bx, 150, 180, 24);
  ctx.fillStyle = '#020617';
  ctx.fillText("ord_{s=1} L(E,s) = 4", bx + 10, 166);
}

function renderHodge() {
  let cx = canvas.width / 2, cy = canvas.height / 2;

  // Kohomologická varieta
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
  ctx.lineWidth = 1;
  for (let i = -100; i <= 100; i += 20) {
    ctx.beginPath();
    ctx.moveTo(cx - 200, cy + i);
    ctx.lineTo(cx + 200, cy + i + Math.sin(i + t) * 15);
    ctx.stroke();
  }

  // Racionální algebraické cykly
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 140, 70, Math.PI / 6, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#fbbf24';
  ctx.font = '13px monospace';
  ctx.fillText("GUT-Cat Racionální Algebraický Cyklus", cx - 130, cy - 85);
}

function renderPoincare() {
  let cx = canvas.width / 2, cy = canvas.height / 2;

  // Ricciho tok vyhladzující manifold na S³
  let factor = Math.sin(t * 1.2) * 0.3 + 0.7; // Pulzní vyhlazování
  let rx = 140 * factor + 20;
  let ry = 140;

  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Vnitřní rovnoběžky 3-sféry S³
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry * 0.3, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.font = '13px monospace';
  ctx.fillText("Ricciho tok: M³ → S³ (Bez neck-pinch singularit)", cx - 170, 45);
}

function draw() {
  ctx.fillStyle = '#090d16';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  if (currentSim === 0) renderPvsNP();
  else if (currentSim === 1) renderRiemann();
  else if (currentSim === 2) renderYangMills();
  else if (currentSim === 3) renderNavierStokes();
  else if (currentSim === 4) renderBSD();
  else if (currentSim === 5) renderHodge();
  else if (currentSim === 6) renderPoincare();
  ctx.restore();
}

function loop() {
  if (isPlaying) {
    t += 0.02;
  }
  draw();
  animId = requestAnimationFrame(loop);
}

initTabs();
updateUI();
loop();
</script>

</body>
</html>
